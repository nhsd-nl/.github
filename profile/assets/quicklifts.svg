<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="QuickLifts: a strength training log that stays out of your way. quicklifts.app"><title>QuickLifts: a strength training log that stays out of your way. quicklifts.app</title><style>@font-face{font-family:'n-head';font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'n-body';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'n-mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'n-monob';font-weight:500;src:url(data:font/woff2;base64,) format('woff2');}
.type{transform-box:fill-box;transform-origin:0 0;animation:type 9s steps(14) infinite}
@keyframes type{0%,8%{transform:scaleX(0)}40%,100%{transform:scaleX(1)}}
.chip{opacity:0;animation:chip 9s infinite}
@keyframes chip{0%,44%{opacity:0;transform:translateY(4px)}50%,92%{opacity:1;transform:none}100%{opacity:0}}
.cur{animation:cur 9s steps(14) infinite}
@keyframes cur{0%,8%{transform:translateX(0)}40%,100%{transform:translateX(134.4px)}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0.5" y="0.5" width="1199" height="319" rx="24" fill="#f4f2ee" stroke="#e6e3dd"/><text x="48" y="68" font-family="n-mono" font-size="11" fill="#6b665e" letter-spacing="1.98">PRODUCT · IPHONE, ANDROID, WEB</text><text x="45" y="128" font-family="n-head" font-size="46" fill="#12110f" letter-spacing="-2.07">QuickLifts</text><text x="48" y="176" font-family="n-body" font-size="17" fill="#57534c">A strength training log that stays out of your way.</text><text x="48" y="204" font-family="n-body" font-size="17" fill="#57534c">One line per exercise, in your own shorthand. It picks</text><text x="48" y="232" font-family="n-body" font-size="17" fill="#57534c">up sets, reps, weight and RPE as you type. Works offline.</text><text x="48" y="288" font-family="n-monob" font-size="13" fill="#8f5e14" letter-spacing="1.04">QUICKLIFTS.APP  →</text><rect x="640" y="40" width="512" height="240" rx="18" fill="#fcfcfb" stroke="#e6e3dd"/><text x="668" y="80" font-family="n-mono" font-size="11" fill="#6b665e" letter-spacing="1.98">TUE · LEGS &amp; PULL</text><text x="1124" y="80" font-family="n-mono" font-size="11" fill="#6b665e" letter-spacing="1.98" text-anchor="end">62 MIN</text><line x1="668" y1="96" x2="1124" y2="96" stroke="#e6e3dd"/><text x="668" y="136" font-family="n-mono" font-size="16" fill="#12110f">squat 5x5 100 @7</text><g><rect x="876" y="119" width="62" height="22" rx="11" fill="#f4f2ee" stroke="#e6e3dd"/><text x="885" y="134" font-family="n-mono" font-size="11" fill="#8f5e14" letter-spacing="0.66">5 SETS</text></g><g><rect x="943.56" y="119" width="62" height="22" rx="11" fill="#f4f2ee" stroke="#e6e3dd"/><text x="952.56" y="134" font-family="n-mono" font-size="11" fill="#8f5e14" letter-spacing="0.66">5 REPS</text></g><g><rect x="1011.1199999999999" y="119" width="62" height="22" rx="11" fill="#f4f2ee" stroke="#e6e3dd"/><text x="1020.1199999999999" y="134" font-family="n-mono" font-size="11" f